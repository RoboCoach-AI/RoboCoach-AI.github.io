  if (video) window.roboCoachMedia?.sync(video);
}
function selectTarget(targetId, updateHash = true) {
  targetTabs.forEach((tab) => {
    const active = tab.dataset.target === targetId;
    tab.classList.toggle('active', active);
    tab.setAttribute('aria-selected', String(active));
  });
  targetPanels.forEach((panel) => {
    const active = panel.id === targetId;
    panel.hidden = !active;
    if (!active) panel.querySelectorAll('video').forEach((video) => video.pause());
    if (active) hydrateVisibleVideo(panel.querySelector('.episode-panel:not([hidden])'));
  });
  if (updateHash) history.replaceState(null, '', `#${targetId}`);
}
function selectEpisode(trigger) {
  const target = trigger.closest('.target-panel');
  if (!target) return;
  target.querySelectorAll('.episode-tab').forEach((tab) => {
    const active = tab === trigger;
    tab.classList.toggle('active', active);
    tab.setAttribute('aria-selected', String(active));
  });
  target.querySelectorAll('.episode-panel').forEach((panel) => {
    const active = panel.id === trigger.dataset.episodeTarget;
    panel.hidden = !active;
    if (!active) panel.querySelectorAll('video').forEach((video) => video.pause());
    if (active) hydrateVisibleVideo(panel);
  });
  trigger.scrollIntoView({block:'nearest', inline:'nearest'});
}
document.querySelectorAll('[data-target]').forEach((trigger) => {
  trigger.addEventListener('click', () => {
    selectTarget(trigger.dataset.target);
    if (trigger.classList.contains('rank-link')) document.querySelector('.targets').scrollIntoView({behavior:'smooth'});
  });
});
document.querySelectorAll('[data-episode-target]').forEach((trigger) => {
  trigger.addEventListener('click', () => selectEpisode(trigger));
});
targetTabs.forEach((tab, index) => tab.addEventListener('keydown', (event) => {
  if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
  event.preventDefault();
  const direction = event.key === 'ArrowRight' ? 1 : -1;
  const next = targetTabs[(index + direction + targetTabs.length) % targetTabs.length];
  next.focus();
  selectTarget(next.dataset.target);
}));
document.querySelectorAll('.episode-tabs').forEach((list) => {
  const tabs = [...list.querySelectorAll('.episode-tab')];
  tabs.forEach((tab, index) => tab.addEventListener('keydown', (event) => {
    if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
    event.preventDefault();
    const direction = event.key === 'ArrowRight' ? 1 : -1;
    const next = tabs[(index + direction + tabs.length) % tabs.length];
    next.focus();
    selectEpisode(next);
  }));
});
const initialTarget = targetPanels.some((panel) => `#${panel.id}` === location.hash)
  ? location.hash.slice(1)
  : 'target-01' || targetPanels[0]?.id;
if (initialTarget) selectTarget(initialTarget, false);
</script></body></html>
